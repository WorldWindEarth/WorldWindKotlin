kotlin.code.style=official
worldwind.minSdk=24
worldwind.targetSdk=36
worldwind.versionCode=27
kotlin.js.generate.executable.default=false
kotlin.mpp.stability.nowarn=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.native.ignoreDisabledTargets=true
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
org.gradle.jvmargs=-Xmx4g
android.useAndroidX=true
# Static iOS frameworks are wrapped manually by SwiftUI/UIKit hosts — moko-resources'
# Xcode copy-phase reminder doesn't apply to our project.
moko.resources.disableStaticFrameworkWarning=true
