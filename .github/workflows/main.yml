name: CI/CD

on:
  push:
    branches: [ "develop", "master" ]
  pull_request:
    branches: [ "develop", "master" ]
  # Manual dry-run of the macOS publish path (full artifact assembly, including the
  # moko-resources iOS pack, into Maven Local — no Sonatype upload). Set dry_run to
  # false on master to force a real publish attempt.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Publish to Maven Local only (no Sonatype upload)'
        type: boolean
        default: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      # CESIUM_ION_TOKEN / GOOGLE_MAPS_API_KEY: baked into the public Pages bundle by
      # generateTutorialApiKeys; lock at provider.
      # Explicit module targets instead of the `build` aggregator: keeps the worldwind +
      # worldwind-compose libraries (and their tests) the only thing validated against the
      # `master` pre-publish gate, plus the tutorials JS bundle that ships to Pages. The
      # codec modules build through publish-codecs.yml and are pulled into the tutorial JS
      # bundle only via their Kotlin/JS NPM bindings — their native cmake chains never run
      # here, regardless of whether cmake is on the runner.
      env:
        CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      run: |
        ./gradlew \
          :worldwind:build \
          :worldwind-compose:build \
          :worldwind-tutorials:jsBrowserDistribution
    - name: Deploy Tutorials to GitHub Pages
      # Only real pushes to develop/master publish the site — never PRs (a same-repo PR
      # would overwrite gh-pages pre-merge) and not publish dry-run dispatches either.
      if: github.event_name == 'push'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: worldwind-tutorials/build/dist/js/productionExecutable
        CLEAN: true
  publish:
    # macOS host is mandatory for a correct publish: moko-resources' iOS pack action
    # shells out to `xcrun`, so Apple klibs built on Linux ship with empty
    # `default/resources/` and every MR.* lookup fails at runtime on iOS. A macOS host
    # can build all targets, so the whole publish (one Sonatype staging repo, including
    # the KMP metadata module that references every target) runs here.
    needs: build
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    # macOS arm64 runner images ship without the Android SDK.
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Check if worldwind.version is already on Maven Central
      id: check-version
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(grep "^worldwind.version=" gradle.properties | cut -d= -f2)
        URL="https://repo1.maven.org/maven2/earth/worldwind/worldwind/$VERSION/worldwind-$VERSION.pom"
        if curl -sfL -o /dev/null "$URL"; then
          echo "::notice::worldwind v$VERSION already on Maven Central — skipping publish (bump worldwind.version in gradle.properties to release a new version)."
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::worldwind v$VERSION not yet on Maven Central — proceeding with publish."
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Publish to Maven Central
      if: github.ref == 'refs/heads/master' && steps.check-version.outputs.should_publish == 'true' && inputs.dry_run != true
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PRIVATE_PASSWORD: ${{ secrets.GPG_PRIVATE_PASSWORD }}
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      run: |
        ./gradlew \
          :worldwind:publishToSonatype \
          :worldwind-compose:publishToSonatype \
          closeSonatypeStagingRepository
    - name: Dry-run publish to Maven Local
      if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PRIVATE_PASSWORD: ${{ secrets.GPG_PRIVATE_PASSWORD }}
      run: |
        ./gradlew \
          :worldwind:publishToMavenLocal \
          :worldwind-compose:publishToMavenLocal
    # The regression this dry run exists to catch: Apple klibs assembled on a host
    # without `xcrun` ship an empty `default/resources/`, breaking every MR.* lookup
    # at runtime on iOS (versions 2.0.1–2.0.8 all shipped that way from ubuntu).
    - name: Verify iOS klibs pack moko resources
      if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
      shell: bash
      run: |
        set -euo pipefail
        for target in iosarm64 iossimulatorarm64; do
          KLIB=$(find ~/.m2/repository/earth/worldwind/worldwind-$target \
            -name "worldwind-$target-*.klib" ! -name "*cinterop*" | head -1 || true)
          if [ -z "$KLIB" ]; then
            echo "::warning::no klib published for $target — skipping resource check"
            continue
          fi
          COUNT=$(unzip -l "$KLIB" | grep -c 'default/resources/.' || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::$KLIB has an empty default/resources/ — moko pack action did not run"
            exit 1
          fi
          echo "$target: $COUNT resource entries in $(basename "$KLIB")"
        done
